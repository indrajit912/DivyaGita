{% extends 'base.html' %}

{% block title %}Server Error - DivyaGita{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 py-5">
    <div class="col-md-6 text-center">
        <h1 class="display-1 text-danger fw-bold mb-3"><i class="bi bi-exclamation-triangle-fill"></i> 500</h1>
        <h2 class="h3 mb-4">Internal Server Error</h2>
        <p class="text-muted mb-5">
            An unexpected error occurred on the server. The administrative team has been notified. 
            Please try again later.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-saffron px-4 py-2">
            <i class="bi bi-house-door-fill"></i> Go to Home
        </a>
    </div>
</div>
{% endblock %}
